name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Run it by hand from the Actions tab.
  workflow_dispatch:
  # Daily rebuild so new Tebex products get share previews and sitemap entries.
  # Prices are always loaded live in the browser, so this is optional; delete it if you prefer.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and test
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Public Tebex token from Settings → Secrets and variables → Actions → Variables.
          # It is public by design. Never store the Tebex private key in this repository.
          VITE_TEBEX_PUBLIC_TOKEN: ${{ vars.TEBEX_PUBLIC_TOKEN }}
          # "/<repo>/" for a project site, "/" for a custom domain or <user>.github.io.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
